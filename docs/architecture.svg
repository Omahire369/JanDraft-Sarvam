<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="JanDraft architecture: the browser sends the complaint to the /api/draft route, which validates it, calls Sarvam AI with the server-only key, then checks and returns the draft">
  <title>JanDraft architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10Z" fill="#3a4356"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 700; fill: #172033; }
    .sub { font-size: 12px; fill: #667085; }
    .line { font-size: 12.5px; fill: #3a4356; }
    .step { font-size: 12px; fill: #172033; }
    .label { font-size: 11px; fill: #3a4356; font-weight: 600; }
    .note { font-size: 11px; fill: #0a5246; font-weight: 600; }
  </style>

  <rect x="0.5" y="0.5" width="899" height="299" rx="14" fill="#f7f5f0" stroke="#d4cfc3"/>

  <!-- Browser -->
  <rect x="30" y="60" width="200" height="180" rx="10" fill="#ffffff" stroke="#d4cfc3"/>
  <text class="title" x="130" y="94" text-anchor="middle">Citizen's browser</text>
  <text class="sub" x="130" y="113" text-anchor="middle">JanDraft UI (React)</text>
  <text class="line" x="130" y="148" text-anchor="middle">complaint, location,</text>
  <text class="line" x="130" y="166" text-anchor="middle">category, language</text>
  <text class="sub" x="130" y="204" text-anchor="middle">edit · copy · download</text>

  <!-- API route -->
  <rect x="320" y="40" width="270" height="220" rx="10" fill="#e7f2ef" stroke="#0e6b5c" stroke-width="1.5"/>
  <text class="title" x="455" y="70" text-anchor="middle">POST /api/draft</text>
  <text class="sub" x="455" y="89" text-anchor="middle">Next.js route handler · server only</text>
  <text class="step" x="342" y="120">1. Validate input and limits</text>
  <text class="step" x="342" y="143">2. Detect script → target language</text>
  <text class="step" x="342" y="166">3. Call Sarvam with the API key</text>
  <text class="step" x="342" y="189">4. Parse and normalise the JSON</text>
  <text class="step" x="342" y="212">5. Check language · retry once</text>
  <text class="note" x="455" y="245" text-anchor="middle">SARVAM_API_KEY never leaves the server</text>

  <!-- Sarvam -->
  <rect x="680" y="60" width="190" height="180" rx="10" fill="#ffffff" stroke="#d4cfc3"/>
  <text class="title" x="775" y="94" text-anchor="middle">Sarvam AI</text>
  <text class="sub" x="775" y="113" text-anchor="middle">chat/completions</text>
  <text class="line" x="775" y="148" text-anchor="middle">model sarvam-105b</text>
  <text class="line" x="775" y="166" text-anchor="middle">JSON mode</text>
  <text class="line" x="775" y="184" text-anchor="middle">reasoning off</text>
  <text class="line" x="775" y="202" text-anchor="middle">temperature 0.3</text>

  <!-- Browser <-> API -->
  <line x1="234" y1="125" x2="314" y2="125" stroke="#3a4356" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label" x="274" y="117" text-anchor="middle">request</text>
  <line x1="314" y1="180" x2="234" y2="180" stroke="#3a4356" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label" x="274" y="198" text-anchor="middle">draft</text>

  <!-- API <-> Sarvam -->
  <line x1="594" y1="125" x2="674" y2="125" stroke="#3a4356" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label" x="634" y="117" text-anchor="middle">prompt</text>
  <line x1="674" y1="180" x2="594" y2="180" stroke="#3a4356" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="label" x="634" y="198" text-anchor="middle">JSON</text>
</svg>
